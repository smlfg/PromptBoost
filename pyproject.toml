[project]
name = "personal-promptboost"
version = "0.1.1"
description = "Local PromptBoost prompt compiler and eval logger."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "jinja2>=3.1.0",
  "pytest>=8.0.0",
  "uvicorn[standard]>=0.30.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
